plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.strikeelite.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.strikeelite.game'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

def launcherIcon = ''
def launcherResources = layout.buildDirectory.dir('generated/strikeLauncher/res')
tasks.register('generateStrikeLauncher') {
    inputs.property('launcherArtwork', launcherIcon)
    outputs.dir(launcherResources)
    doLast {
        def output = launcherResources.get().file('drawable-nodpi/strike_launcher.png').asFile
        output.parentFile.mkdirs()
        output.bytes = launcherIcon.decodeBase64()
    }
}
android.sourceSets.main.res.srcDir(launcherResources)
tasks.named('preBuild').configure { dependsOn('generateStrikeLauncher') }
